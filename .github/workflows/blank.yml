
name: Student Task Manager CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    name: Validate Repository
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check README file
        run: test -s README.md

      - name: Display success message
        run: echo "CI pipeline executed successfully!"
